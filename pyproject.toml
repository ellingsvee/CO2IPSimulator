[project]
name = "co2ipsimulator"
version = "0.1.0"
description = "Invasion-percolation simulator for CO2 migration in 3-D porous media."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Elling Svee", email = "86355496+ellingsvee@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "imageio>=2.37.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pymc>=5.28.5",
    "pyvista>=0.48.2",
]

[project.urls]
Repository = "https://github.com/ellingsvee/CO2IPSimulator"

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]

[build-system]
requires = ["maturin>=1.13.1,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "co2ipsimulator.rust"
python-packages = ["co2ipsimulator"]
python-source = "src"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
